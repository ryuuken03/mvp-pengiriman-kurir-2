<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTM Sidoarjo v2.0 - Simulator Operasional Multi-Peran</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TOP COMMAND BAR -->
  <header class="top-nav">
    <div class="brand-group">
      <div class="brand-symbol">MTM</div>
      <div>
        <div class="brand-title">
          MTM Sidoarjo v2.0
          <span class="badge-system">SIMULATOR 3-PERAN</span>
        </div>
        <div class="brand-sub">Minta Dibelikan &bull; Servis & Bantuan &bull; Antar / Kirim P2P</div>
      </div>
    </div>

    <!-- VIEWPORT SWITCHER -->
    <div class="view-switcher" id="viewSwitcher">
      <button class="view-btn active" data-view="grid3">Semua Peran (3 Panel)</button>
      <button class="view-btn" data-view="customer">Pelanggan</button>
      <button class="view-btn" data-view="driver">Mitra Kurir</button>
      <button class="view-btn" data-view="admin">Admin</button>
    </div>

    <!-- QUICK DEMO ACTIONS (3 PILAR MTM) -->
    <div class="nav-actions">
      <button class="btn-demo jastip" id="btnDemoShopping" title="Simulasi titip beli warung PKL dengan dana talangan kurir">
        Demo 1: Minta Dibelikan
      </button>
      <button class="btn-demo service" id="btnDemoService" title="Simulasi sewa jasa tenaga bersih-bersih 2 jam">
        Demo 2: Servis & Bantuan
      </button>
      <button class="btn-demo p2p" id="btnDemoDelivery" title="Simulasi antar paket dokumen penting P2P">
        Demo 3: Antar Paket P2P
      </button>
      <button class="btn-nav-outline" id="btnResetAll" title="Reset data simulasi ke awal pabrik">
        Reset Data
      </button>
    </div>
  </header>

  <!-- MAIN SIMULATOR STAGE (3 PANELS: CUSTOMER, DRIVER, ADMIN) -->
  <main class="simulator-stage view-grid3" id="simulatorStage">

    <!-- 1. CUSTOMER APP -->
    <section class="device-panel" id="panel-customer">
      <div class="panel-header role-customer">
        <div class="role-indicator">
          <span class="role-dot"></span>
          <span class="role-name">Aplikasi Pelanggan</span>
        </div>
        <div class="panel-header-actions">
          <a href="customer.html" target="_blank" class="tag-link-external" title="Buka aplikasi pelanggan di tab baru">Layar Penuh &nearr;</a>
          <span class="tag-role">Customer</span>
        </div>
      </div>
      <div class="device-shell">
        <iframe src="customer.html" class="simulator-iframe" id="iframeCustomer" title="Aplikasi Pelanggan"></iframe>
      </div>
    </section>

    <!-- 2. DRIVER APP -->
    <section class="device-panel" id="panel-driver">
      <div class="panel-header role-driver">
        <div class="role-indicator">
          <span class="role-dot"></span>
          <span class="role-name">Aplikasi Mitra Kurir & Runner</span>
        </div>
        <div class="panel-header-actions">
          <a href="driver.html" target="_blank" class="tag-link-external" title="Buka aplikasi kurir di tab baru">Layar Penuh &nearr;</a>
          <span class="tag-role">Driver</span>
        </div>
      </div>
      <div class="device-shell">
        <iframe src="driver.html" class="simulator-iframe" id="iframeDriver" title="Aplikasi Mitra Kurir"></iframe>
      </div>
    </section>

    <!-- 3. ADMIN CONSOLE -->
    <section class="device-panel" id="panel-admin">
      <div class="panel-header role-admin">
        <div class="role-indicator">
          <span class="role-dot"></span>
          <span class="role-name">Konsol Pengawas Admin & Dispatcher</span>
        </div>
        <div class="panel-header-actions">
          <a href="admin.html" target="_blank" class="tag-link-external" title="Buka konsol admin di tab baru">Layar Penuh &nearr;</a>
          <span class="tag-role">Admin</span>
        </div>
      </div>
      <div class="device-shell">
        <iframe src="admin.html" class="simulator-iframe" id="iframeAdmin" title="Konsol Pengawas Admin"></iframe>
      </div>
    </section>

  </main>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-box" id="toastBox">
    Pemberitahuan
  </div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>

</html>
